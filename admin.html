<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — ExtraVisualDLC</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-orbs"><span class="orb orb-1"></span><span class="orb orb-2"></span></div>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">E</span>
      <span class="logo-text">ExtraVisualDLC</span>
    </a>
    <nav class="nav" id="nav">
      <a href="profile.html">Профиль</a>
      <a href="moder.html">Модер-панель</a>
      <a href="index.html">Сайт</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-ghost" id="logoutBtn">Выйти</button>
    </div>
    <button class="burger" id="burger" aria-label="Меню"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="container admin-wrap">
  <h1 class="admin-title">Админ-панель</h1>
  <p class="muted-text admin-sub" id="helloLine"></p>

  <div id="denied" class="profile-card center" style="display:none">
    <h2>Нет доступа ⛔</h2>
    <p class="muted-text">Эта страница только для администрации.</p>
    <a href="index.html" class="btn btn-primary">На главную</a>
  </div>

  <div id="panel" style="display:none">
    <div class="stat-grid" id="stats"></div>

    <div class="mtabs tabs" id="mtabs">
      <button class="tab active" data-f="all">Все</button>
      <button class="tab" data-f="banned">Забаненные</button>
      <button class="tab" data-f="frozen">Замороженные</button>
      <button class="tab" data-f="tg">С Telegram</button>
      <button class="tab" data-f="new">Новые 24ч</button>
    </div>

    <div class="admin-bar">
      <input type="text" class="auth-input admin-search" id="search" placeholder="Поиск: email, ник, UID, HWID…">
      <span class="muted-text" id="count"></span>
    </div>
    <div class="panel-actions">
      <button class="btn btn-outline" id="csvBtn">⬇ Экспорт CSV</button>
      <button class="btn btn-ghost" id="reloadBtn">↻ Обновить</button>
    </div>
    <div class="form-msg" id="msg"></div>
    <div class="table-scroll">
      <table class="admin-table" id="table">
        <thead>
          <tr><th>UID</th><th>Ник</th><th>Email</th><th>Роль</th><th>Статус</th><th>TG</th><th>HWID</th><th>Регистрация</th><th>Действия</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vzfjwchkdaafnsoxzddt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_sqljifUjv-s140nxHWZ5rw_yWJpg_eo";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ALLOWED = ["Админ", "Разработчик", "Кирюха"];
const ALL_ROLES = ["Пользователь", "Модератор", "Админ", "Разработчик", "Кирюха"];

document.getElementById('burger').addEventListener('click', () => document.getElementById('nav').classList.toggle('open'));
document.getElementById('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.href = "index.html"; });

function setMsg(t, ok){ const m = document.getElementById('msg'); m.textContent = t || ""; m.className = "form-msg" + (t ? (ok ? " ok" : " err") : ""); }
async function token(){
  const { data } = await sb.auth.getSession();
  return data.session ? data.session.access_token : null;
}
async function api(method, body, q){
  const t = await token();
  const r = await fetch('/api/admin-users' + (q ? '?q=' + encodeURIComponent(q) : ''), {
    method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
    body: body ? JSON.stringify(body) : undefined
  });
  return { status: r.status, json: await r.json().catch(() => ({})) };
}

let users = [];
let myRole = "";
let tabFilter = "all";
function badges(u){
  const b = [];
  if (u.banned) b.push('<span class="badge b-red">ЗАБАНЕН</span>');
  if (u.frozen) b.push('<span class="badge b-yellow">ЗАМОРОЖЕН</span>');
  return b.join(' ') || '<span class="muted-text">—</span>';
}
function isNew(u){ return Date.now() - new Date(u.created_at).getTime() < 24 * 3600 * 1000; }
function filtered(){
  const q = (document.getElementById('search').value || "").toLowerCase();
  return users.filter(u => {
    if (tabFilter === "banned" && !u.banned) return false;
    if (tabFilter === "frozen" && !u.frozen) return false;
    if (tabFilter === "tg" && !u.tg) return false;
    if (tabFilter === "new" && !isNew(u)) return false;
    return !q || (u.email || "").toLowerCase().includes(q) ||
      (u.username || "").toLowerCase().includes(q) || String(u.uid || "").includes(q) ||
      (u.hwid || "").toLowerCase().includes(q);
  });
}
function renderStats(){
  const day = Date.now() - 24 * 3600 * 1000;
  const s = [
    ["s-violet", users.length, "всего"],
    ["s-red", users.filter(u => u.banned).length, "забанено"],
    ["s-yellow", users.filter(u => u.frozen).length, "заморожено"],
    ["s-green", users.filter(u => u.tg).length, "с Telegram"],
    ["s-cyan", users.filter(u => new Date(u.created_at).getTime() > day).length, "новые 24ч"],
  ];
  document.getElementById('stats').innerHTML = s.map(([c, n, t]) =>
    `<div class="stat-card ${c}"><b>${n}</b><span>${t}</span></div>`).join('');
}
function render(){
  renderStats();
  const list = filtered();
  document.getElementById('count').textContent = "Показано: " + list.length + " / " + users.length;
  document.getElementById('rows').innerHTML = list.map(u => `<tr>
    <td><b>${u.uid ?? '—'}</b></td>
    <td>${u.username ? escapeHtml(u.username) : '<span class="muted-text">—</span>'}</td>
    <td class="email-cell">${escapeHtml(u.email)}</td>
    <td><select class="role-sel" data-id="${u.user_id}" data-cur="${escapeHtml(u.role)}">
      ${ALL_ROLES.map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}
    </select></td>
    <td>${badges(u)}</td>
    <td>${u.tg ? '<span class="tg-yes">✔</span>' : '<span class="tg-no">—</span>'}</td>
    <td class="hwid-cell" title="${escapeHtml(u.hwid || '')}">${u.hwid ? escapeHtml(u.hwid) : '<span class="tg-no">—</span>'}</td>
    <td class="muted-text">${new Date(u.created_at).toLocaleDateString('ru-RU')}</td>
    <td class="actions">
      ${u.banned
        ? `<button class="mini-btn ok" data-act="unban" data-id="${u.user_id}">Разбанить</button>`
        : `<button class="mini-btn danger" data-act="ban" data-id="${u.user_id}">Забанить</button>`}
      ${u.frozen
        ? `<button class="mini-btn ok" data-act="unfreeze" data-id="${u.user_id}">Разморозить</button>`
        : `<button class="mini-btn warn" data-act="freeze" data-id="${u.user_id}">Заморозить</button>`}
      ${u.hwid ? `<button class="mini-btn warn" data-act="reset_hwid" data-id="${u.user_id}" title="Отвязать ПК">HWID✕</button>` : ``}
      <button class="mini-btn danger" data-act="delete_user" data-id="${u.user_id}" title="Удалить аккаунт полностью">✕</button>
    </td>
  </tr>`).join('');
}
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

document.getElementById('search').addEventListener('input', render);
document.getElementById('reloadBtn').addEventListener('click', load);
document.getElementById('mtabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  document.querySelectorAll('#mtabs .tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  tabFilter = b.dataset.f;
  render();
});
document.getElementById('csvBtn').addEventListener('click', () => {
  const rows = [["uid","nick","email","role","banned","frozen","tg","hwid","created_at"]]
    .concat(filtered().map(u => [u.uid ?? "", u.username || "", u.email, u.role, u.banned ? 1 : 0, u.frozen ? 1 : 0, u.tg ? 1 : 0, u.hwid || "", u.created_at]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "extravisualdlc-users.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('rows').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const actNames = { ban: 'забанить', unban: 'разбанить', freeze: 'заморозить', unfreeze: 'разморозить', reset_hwid: 'сбросить HWID (отвязать ПК)', delete_user: 'УДАЛИТЬ АККАУНТ ПОЛНОСТЬЮ' };
  if (!confirm(`Точно ${actNames[b.dataset.act]} этого пользователя?`)) return;
  setMsg("");
  const { status, json } = await api('POST', { action: b.dataset.act, user_id: b.dataset.id });
  if (!json.ok) return setMsg(json.error || ("Ошибка " + status));
  setMsg("Готово ✅", true);
  load();
});
document.getElementById('rows').addEventListener('change', async e => {
  const s = e.target.closest('select.role-sel');
  if (!s) return;
  if (s.value === s.dataset.cur) return;
  if (!confirm(`Выдать роль «${s.value}»?`)) { s.value = s.dataset.cur; return; }
  const { json } = await api('POST', { action: 'set_role', user_id: s.dataset.id, role: s.value });
  if (!json.ok) { setMsg(json.error || "Ошибка"); s.value = s.dataset.cur; return; }
  setMsg("Роль выдана ✅", true);
  load();
});

async function load(){
  const { status, json } = await api('GET');
  if (!json.ok || !ALLOWED.includes(json.myRole)) {
    document.getElementById('denied').style.display = '';
    return;
  }
  myRole = json.myRole;
  document.getElementById('helloLine').textContent = `Вошёл как ${myRole} · всего пользователей: ${json.users.length}`;
  document.getElementById('panel').style.display = '';
  users = json.users;
  render();
}
load();
</script>
</body>
</html>
